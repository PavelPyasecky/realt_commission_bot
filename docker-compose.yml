services:
  bot:
    build: .
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped

  celery:
    build: .
    command: celery -A app.celery_app.celery_app worker -B --loglevel=INFO
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
